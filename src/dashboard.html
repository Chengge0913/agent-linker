<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作时间线</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei UI',sans-serif;color:#243346;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{padding:22px 56px 18px 28px;border-bottom:1px solid #e5ebf1;background:#fff}h1{font-size:20px;margin:0 0 6px;color:#1c344c}.running-title{display:inline-block;background:linear-gradient(100deg,#728295 20%,#203c56 45%,#728295 70%);background-size:220% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:shimmer 2.1s ease-in-out infinite}@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}@media(prefers-reduced-motion:reduce){.running-title{animation:none;color:#1c344c;background:none}}header p{font-size:13px;margin:0;color:#748495}main{max-width:920px;padding:24px 64px 60px 28px;margin:auto}.session-title{font-size:19px;font-weight:700;margin:0 0 6px;color:#1b334b}.session-meta{font-size:12px;color:#7b8b9a;overflow-wrap:anywhere;margin-bottom:24px}.stream{display:flex;flex-direction:column;gap:14px}.message{padding:0 0 8px;border-bottom:1px solid #edf1f4}.message-head{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:#244d3b;margin-bottom:8px}.message-head time{font-weight:400;font-size:12px;color:#82918d}.message-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.75;color:#243447}.tool-group{border-left:2px solid #dce5ed;margin:0 0 0 2px;padding-left:10px;color:#6a7c8e;font-size:12px}.tool-group summary{cursor:pointer;list-style:none;padding:6px 0}.tool-group summary::-webkit-details-marker{display:none}.tool-group summary:before{content:'▸';margin-right:6px}.tool-group[open]>summary:before{content:'▾'}.tool-group pre{font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f7;padding:10px;border-radius:6px;max-height:320px;overflow:auto;color:#48596a}.tool-group .failure{color:#a43b32}.empty{color:#8494a3;font-size:14px;padding:28px 0}.foot,.error-line{font-size:12px;color:#8494a3;margin-top:24px}.error-line{color:#a8463c}
.rail{position:fixed;top:0;bottom:0;right:0;width:32px;z-index:5;background:#f0f5f9;border-left:1px solid #dce6ee;transition:width .18s ease;overflow:hidden;box-shadow:-2px 0 12px #1e3b4d0a}.rail:hover,.rail:focus-within,.rail.pinned{width:min(300px,85vw);background:#fff;box-shadow:-6px 0 25px #1e3b4d18}.rail-label{position:absolute;top:20px;right:8px;writing-mode:vertical-rl;color:#6a8194;font-size:13px;letter-spacing:2px;pointer-events:none}.rail:hover .rail-label,.rail:focus-within .rail-label,.rail.pinned .rail-label{display:none}.rail-content{width:min(300px,85vw);padding:18px 38px 18px 14px;opacity:0;visibility:hidden;transition:opacity .12s ease}.rail:hover .rail-content,.rail:focus-within .rail-content,.rail.pinned .rail-content{opacity:1;visibility:visible}.rail-heading{font-size:16px;font-weight:700;color:#27465e;margin:0 0 6px}.rail-note{font-size:12px;color:#8797a6;margin:0 0 14px}.session-list{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 110px);overflow:auto}.session-button{display:block;text-align:left;width:100%;background:transparent;border:0;border-radius:7px;padding:10px;cursor:pointer;color:#304b61;font:inherit}.session-button:hover,.session-button.active{background:#eef5fa}.session-button .name{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}.session-button .sub{display:block;font-size:11px;color:#8091a0;margin-top:4px}.session-button.running .sub{color:#26805b}.session-button.blocked .sub{color:#ad4e45}.rail-toggle{position:absolute;right:0;top:0;width:32px;height:100%;border:0;background:transparent;cursor:pointer;z-index:2}@media(max-width:500px){header{padding-left:18px}main{padding-left:18px;padding-right:50px}.message-body{font-size:16px}}
:root{color-scheme:dark;color:#e7e7e7;background:#171717}body{background:#171717}header{background:#171717;border-bottom-color:#2b2b2b}h1,.session-title{color:#f1f1f1}.running-title{background-image:linear-gradient(100deg,#858585 20%,#eeeeee 45%,#858585 70%)}.session-meta,.foot,.empty{color:#979da4}.message{border-bottom-color:#2d2d2d}.message-head time{color:#a2a7ac}.message-body{color:#e6e6e6}.tool-group{border-left-color:#404040;color:#a7b2bd}.tool-group pre{background:#252525;color:#d5d5d5}.tool-group .failure,.error-line{color:#ee948c}.rail{background:#1c1c1c;border-left-color:#323232;box-shadow:-2px 0 12px #0003}.rail:hover,.rail:focus-within,.rail.pinned{background:#202020;box-shadow:-6px 0 25px #0006}.rail-label,.rail-note{color:#a2aab1}.rail-heading{color:#ededed}.session-button{color:#d7dce0}.session-button:hover,.session-button.active{background:#303030}.session-button .sub{color:#9ba6ae}.session-button.running .sub{color:#83caa5}.session-button.blocked .sub{color:#f19b91}@media(prefers-reduced-motion:reduce){.running-title{color:#f1f1f1}}
</style></head><body><header><h1><span id="agent-title">协作进度</span><span id="header-model" style="font-size:20px;color:#d7d7d7;font-weight:600;margin-left:12px"></span></h1></header><main>
<div class="session-title" id="title">等待任务</div><div class="session-meta" id="meta"></div><div id="stream" class="stream"></div><div id="empty" class="empty">暂无任务。</div><p class="error-line" id="error"></p>
</main><aside class="rail" id="rail" aria-label="会话列表"><button class="rail-toggle" id="rail-toggle" aria-label="打开会话列表" aria-expanded="false"></button><div class="rail-label">会话</div><div class="rail-content"><p class="rail-heading">会话</p><p class="rail-note">将鼠标移开以收起</p><div class="session-list" id="sessions"></div></div></aside>
<script>
const list=document.getElementById('sessions'),stream=document.getElementById('stream'),title=document.getElementById('title'),agentTitle=document.getElementById('agent-title'),headerModel=document.getElementById('header-model'),meta=document.getElementById('meta'),empty=document.getElementById('empty'),err=document.getElementById('error'),rail=document.getElementById('rail'),railToggle=document.getElementById('rail-toggle');
const states={pending:'等待执行',running:'执行中',delivered:'结果已返回',blocked:'遇到阻塞'};const workLabels={wb:'WorkBuddy',dsh:'DSH'};const workName=w=>workLabels[w]||(w?w.toUpperCase():'执行端');let selected=null,lastRunning=null,lastKey='',listKey='',refreshing=false,expandedHistory=false,tasks=[];
railToggle.onclick=()=>{const expanded=rail.classList.toggle('pinned');railToggle.setAttribute('aria-expanded',String(expanded));};
rail.addEventListener('mouseleave',()=>{rail.classList.remove('pinned');railToggle.setAttribute('aria-expanded','false');});
function time(s){if(!s)return '';const d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString('zh-CN',{hour12:false});}
function duration(t){if(t.state==='pending')return '尚未开始';const start=Date.parse(t.started_at),end=t.state==='running'?Date.now():Date.parse(t.finished_at);if(!Number.isFinite(start)||!Number.isFinite(end)||end<start)return '时间未知';const seconds=Math.floor((end-start)/1000);return Math.floor(seconds/60)+'min'+(seconds%60)+'s';}
function addTool(parent,e,outputs){const item=document.createElement('details');item.className='tool-group';if(e.call_id)item.dataset.callId=e.call_id;const head=document.createElement('summary');head.textContent='调用 '+(e.name||'工具')+(e.time?' · '+time(e.time):'')+(outputs.some(x=>x.kind==='error')?' · 出错':'');const input=document.createElement('pre');input.textContent='调用参数\n'+(e.text||'');item.append(head,input);for(const out of outputs){const pre=document.createElement('pre');if(out.kind==='error')pre.className='failure';pre.textContent=(out.kind==='error'?'执行结果（错误）':'执行结果')+'\n'+out.text;item.append(pre);}parent.append(item);}
function draw(events){const key=JSON.stringify(events);if(key===lastKey)return;lastKey=key;const openIds=new Set([...stream.querySelectorAll('details[open][data-call-id]')].map(e=>e.dataset.callId));stream.replaceChildren();empty.hidden=events.length>0;if(!events.length){empty.textContent='等待执行端产生可展示的事件。';return;}
const outputs=new Map(),callIds=new Set(events.filter(e=>e.kind==='tool'&&e.call_id).map(e=>e.call_id));for(const e of events)if((e.kind==='result'||e.kind==='error')&&e.call_id){if(!outputs.has(e.call_id))outputs.set(e.call_id,[]);outputs.get(e.call_id).push(e);}
for(const e of events){if(e.kind==='message'){const block=document.createElement('section');block.className='message';const h=document.createElement('div');h.className='message-head';const stamp=document.createElement('time');stamp.textContent=time(e.time);h.append(stamp);const text=document.createElement('div');text.className='message-body';text.textContent=e.text||'';block.append(h,text);stream.append(block);}else if(e.kind==='tool'){const related=outputs.get(e.call_id)||[];addTool(stream,e,related);const node=stream.lastChild;if(openIds.has(e.call_id))node.open=true;}else if((e.kind==='result'||e.kind==='error')&&!callIds.has(e.call_id)){addTool(stream,{name:'执行记录',time:e.time,text:'没有关联的调用参数'},[e]);}}
}
function showSessions(){const current=tasks.filter(t=>t.state==='running'||t.state==='pending'),history=tasks.filter(t=>t.state!=='running'&&t.state!=='pending');const visible=current.concat(expandedHistory?history:history.slice(0,5));const key=JSON.stringify([selected,expandedHistory,tasks.map(t=>[t.id,t.name,t.state])]);if(key!==listKey){listKey=key;list.replaceChildren();for(const t of visible){const button=document.createElement('button');button.className='session-button '+t.state+(t.id===selected?' active':'');const name=document.createElement('span');name.className='name';name.textContent=t.name||'未命名任务';const sub=document.createElement('span');sub.className='sub';button.append(name,sub);button.onclick=()=>{selected=t.id;lastKey='';rail.classList.remove('pinned');railToggle.setAttribute('aria-expanded','false');button.blur();refresh();};list.append(button);}if(history.length>5){const more=document.createElement('button');more.className='session-button history-toggle';more.textContent=expandedHistory?'收起历史记录':'展开其余 '+(history.length-5)+' 条';more.onclick=()=>{expandedHistory=!expandedHistory;showSessions();};list.append(more);}}visible.forEach((t,i)=>{list.children[i].querySelector('.sub').textContent=workName(t.worker)+' · '+(states[t.state]||t.state)+' · '+duration(t);});}
async function refresh(){if(refreshing)return;refreshing=true;try{const response=await fetch('api/tasks',{cache:'no-store'});if(!response.ok)throw new Error('队列暂不可用');tasks=await response.json();if(!tasks.length){selected=null;list.replaceChildren();agentTitle.textContent='协作进度';agentTitle.className='';headerModel.textContent='';title.textContent='等待任务';meta.textContent='';stream.replaceChildren();empty.hidden=false;empty.textContent='暂无任务。';err.textContent='';return;}
const running=tasks.find(t=>t.state==='running');agentTitle.textContent=running?workName(running.worker)+' 运行中':'协作进度';agentTitle.className=running?'running-title':'';if(!selected||!tasks.some(t=>t.id===selected)||(running&&running.id!==lastRunning)){selected=(running||tasks.find(t=>t.state==='pending')||tasks[0]).id;lastKey='';}lastRunning=running?.id||null;showSessions();const task=tasks.find(t=>t.id===selected);const shownModel=running||task;headerModel.textContent=shownModel.model||'模型未记录';title.textContent=task.name||'未命名任务';meta.textContent=(states[task.state]||task.state)+' · '+workName(task.worker)+' · '+duration(task)+(running&&running.id!==task.id?' · 此会话模型：'+(task.model||'未记录'):'')+' · 回执：'+(task.receipt||'尚无');const detail=await fetch('api/task/'+selected,{cache:'no-store'});if(!detail.ok)throw new Error('工单暂不可用');const data=await detail.json();draw(data.timeline);err.textContent='';}catch(e){err.textContent='连接中断：'+e.message;}finally{refreshing=false;}}
refresh();setInterval(refresh,1000);
</script></body></html>
