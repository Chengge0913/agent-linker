const states={pending:'等待执行',running:'执行中',delivered:'结果已返回',blocked:'遇到阻塞'};const workLabels={wb:'WorkBuddy',dsh:'DeepSeek Harness'};const workName=w=>workLabels[w]||(w?w.toUpperCase():'执行端');let detailOpen=false,selectedGroup=null,selected=null,lastRunning=null,lastKey='',listKey='',refreshing=false,expandedHistory=false,tasks=[],knownActive=new Set();

const activeGrid=document.getElementById('active-grid'),brandMark=document.querySelector('.brand-mark');
function setLogo(element,model,worker){const value=(model||'').toLowerCase();const id=worker==='codex'?'logo-openai':worker==='wb'?'logo-codebuddy':worker==='dsh'?'logo-deepseek':value.includes('deepseek')?'logo-deepseek':value.includes('glm')||value.includes('zhipu')?'logo-zhipu':null;const template=id&&document.getElementById(id);element.replaceChildren();if(template)element.append(template.content.cloneNode(true));else element.textContent='✦';}
async function showActive(){
 const current=tasks.filter(t=>t.group_id && t.group_id===selectedGroup);
 if(current.length<2){const detail=document.getElementById('task-detail');activeGrid.after(detail);activeGrid.replaceChildren();return;}
 const cards=await Promise.all(current.map(async t=>{
  const card=document.createElement('section');card.className='active-card';card.dataset.taskId=t.id;
  const head=document.createElement('h2'),logo=document.createElement('span');logo.className='active-logo';setLogo(logo,t.model,t.worker);head.append(logo,document.createTextNode(workName(t.worker)));
  const info=document.createElement('div');info.className='active-meta';info.textContent=(states[t.state]||t.state)+' · '+(t.model?'LLM: '+t.model+(t.model_source==='配置'?'（配置）':''):'模型未记录')+' · '+duration(t);
  const latest=document.createElement('div');latest.className='active-latest';
  try{const response=await fetch('api/task/'+t.id,{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();const event=[...data.timeline].reverse().find(e=>e.kind==='message'||e.kind==='tool'||e.kind==='error');const text=event?(event.kind==='tool'?'调用 '+(event.name||'工具'):event.text||'等待事件'):'等待执行端产生事件。';const preview=text.split(/\r?\n\s*\r?\n/)[0].replace(/^[#\s]+/,'').replace(/\*\*(.*?)\*\*/g,'$1');latest.textContent=preview.length>120?preview.slice(0,120)+'…':preview;}catch{latest.textContent='暂时无法读取任务事件';}
  const button=document.createElement('button');button.textContent=detailOpen&&selected===t.id?'收起记录':'查看完整记录';button.onclick=()=>{detailOpen=selected===t.id?!detailOpen:true;selected=t.id;lastKey='';refresh();};card.append(head,info,latest,button);return card;
 }));
 const detail=document.getElementById('task-detail');activeGrid.after(detail);if(activeGrid.textContent!==cards.map(card=>card.textContent).join(''))activeGrid.replaceChildren(...cards);const target=[...activeGrid.children].find(card=>card.dataset.taskId===selected);if(target&&detailOpen)target.append(detail);
}

railToggle.onclick=()=>{const expanded=rail.classList.toggle('pinned');railToggle.setAttribute('aria-expanded',String(expanded));};
rail.addEventListener('mouseleave',()=>{rail.classList.remove('pinned');railToggle.setAttribute('aria-expanded','false');});
function time(s){if(!s)return '';const d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString('zh-CN',{hour12:false});}
function duration(t){if(t.state==='pending')return '尚未开始';const start=Date.parse(t.started_at),end=t.state==='running'?Date.now():Date.parse(t.finished_at);if(!Number.isFinite(start)||!Number.isFinite(end)||end<start)return '时间未知';const seconds=Math.floor((end-start)/1000);return Math.floor(seconds/60)+'min'+(seconds%60)+'s';}
function addTool(parent,e,outputs){const item=document.createElement('details');item.className='tool-group';if(e.call_id)item.dataset.callId=e.call_id;const head=document.createElement('summary');head.textContent='调用 '+(e.name||'工具')+(outputs.some(x=>x.kind==='error')?' · 出错':'');const input=document.createElement('pre');input.textContent='调用参数\n'+(e.text||'');item.append(head,input);for(const out of outputs){const pre=document.createElement('pre');if(out.kind==='error')pre.className='failure';pre.textContent=(out.kind==='error'?'执行结果（错误）':'执行结果')+'\n'+out.text;item.append(pre);}parent.append(item);}
function appendFormatted(parent,content){
 for(const line of content.split(/(?<=\n)/)){
  const heading=line.match(/^#{1,6}[ \t]+([^\n]*)(\n?)$/);const container=heading?document.createElement('span'):parent;
  if(heading)container.className='message-heading';
  const parts=(heading?heading[1]:line).split(/(\*\*[^*\n]+\*\*)/g);
  for(const part of parts){if(part.startsWith('**')&&part.endsWith('**')&&part.length>4){const strong=document.createElement('strong');strong.textContent=part.slice(2,-2);container.append(strong);}else container.append(document.createTextNode(part));}
  if(heading)parent.append(container);
 }
}
function renderMessage(parent,content,eventIndex,openDetails){
  const pattern=/^```[^\n]*\n[\s\S]*?^```[ \t]*$|^[ \t]*(?:#{1,6}[ \t]+)?(?:\*\*)?(?:任务[ \t]*ID[：:][ \t]*)?TASK_(?:ID|STATUS)=[^\r\n]+$/gm;
  let offset=0,match,index=0;
  while((match=pattern.exec(content))!==null){
    const before=content.slice(offset,match.index).replace(/^\n+|\n+$/g,'').replace(/\n{3,}/g,'\n\n');
    if(before){const paragraph=document.createElement('div');appendFormatted(paragraph,before);parent.append(paragraph);}
    const details=document.createElement('details');details.className='message-detail';
    details.dataset.detailKey=eventIndex+':'+index++;
    details.open=openDetails.has(details.dataset.detailKey);
    const summary=document.createElement('summary');summary.textContent=match[0].trimStart().startsWith('```')?'查看代码':'查看任务信息';
    const pre=document.createElement('pre');pre.textContent=match[0];details.append(summary,pre);parent.append(details);
    offset=pattern.lastIndex;
  }
  const remaining=content.slice(offset).replace(/^\n+|\n+$/g,'').replace(/\n{3,}/g,'\n\n');
  if(remaining){const paragraph=document.createElement('div');appendFormatted(paragraph,remaining);parent.append(paragraph);}
}
function draw(events){const key=JSON.stringify(events);if(key===lastKey)return;lastKey=key;const openIds=new Set([...stream.querySelectorAll('details[open][data-call-id]')].map(e=>e.dataset.callId));const openDetails=new Set([...stream.querySelectorAll('details[open][data-detail-key]')].map(e=>e.dataset.detailKey));stream.replaceChildren();empty.hidden=events.length>0;if(!events.length){empty.textContent='等待执行端产生可展示的事件。';return;}
const outputs=new Map(),callIds=new Set(events.filter(e=>e.kind==='tool'&&e.call_id).map(e=>e.call_id));for(const e of events)if((e.kind==='result'||e.kind==='error')&&e.call_id){if(!outputs.has(e.call_id))outputs.set(e.call_id,[]);outputs.get(e.call_id).push(e);}
for(const [eventIndex,e] of events.entries()){if(e.kind==='message'){const block=document.createElement('section');block.className='message';const h=document.createElement('div');h.className='message-head';const stamp=document.createElement('time');stamp.textContent=time(e.time);h.append(stamp);const text=document.createElement('div');text.className='message-body';renderMessage(text,e.text||'',eventIndex,openDetails);block.append(h,text);stream.append(block);}else if(e.kind==='tool'){const related=outputs.get(e.call_id)||[];addTool(stream,e,related);const node=stream.lastChild;if(openIds.has(e.call_id))node.open=true;}else if((e.kind==='result'||e.kind==='error')&&!callIds.has(e.call_id)){addTool(stream,{name:'执行记录',time:e.time,text:'没有关联的调用参数'},[e]);}}
}
function showSessions(){
 const groups=new Map();
 for(const task of tasks){const id=task.group_id||task.id;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(task);}
 const key=JSON.stringify([selectedGroup,selected,expandedHistory,tasks.map(t=>[t.id,t.state,t.group_id])]);
 if(key===listKey)return;listKey=key;list.replaceChildren();
 const all=[...groups.entries()];const visible=expandedHistory?all:all.slice(0,5);
 for(const [id,items] of visible){const button=document.createElement('button');button.className='session-button'+(id===selectedGroup?' active':'');const name=document.createElement('span');name.className='name';name.textContent=items.length>1?'协作任务 · '+items.map(t=>workName(t.worker)).join(' / '):items[0].name;const sub=document.createElement('span');sub.className='sub';sub.textContent=items.map(t=>workName(t.worker)+' '+(states[t.state]||t.state)).join(' · ');button.append(name,sub);button.onclick=()=>{selectedGroup=id;selected=items[0].id;detailOpen=items.length===1;lastKey='';rail.classList.remove('pinned');refresh();};list.append(button);}
 if(all.length>5){const more=document.createElement('button');more.className='session-button';more.textContent=expandedHistory?'收起历史记录':'展开历史记录';more.onclick=()=>{expandedHistory=!expandedHistory;showSessions();};list.append(more);}
}
async function refresh(){if(refreshing)return;refreshing=true;try{const response=await fetch('api/tasks',{cache:'no-store'});if(!response.ok)throw new Error('队列暂不可用');tasks=await response.json();if(!tasks.length){selected=null;list.replaceChildren();agentTitle.textContent='协作进度';agentTitle.className='';headerModel.textContent='';title.textContent='等待任务';meta.textContent='';stream.replaceChildren();empty.hidden=false;empty.textContent='暂无任务。';err.textContent='';return;}
const running=tasks.find(t=>t.state==='running');const active=tasks.filter(t=>t.state==='running'||t.state==='pending');const newActive=active.find(t=>!knownActive.has(t.id));knownActive=new Set(active.map(t=>t.id));if(newActive){selected=newActive.id;selectedGroup=newActive.group_id||newActive.id;detailOpen=false;lastKey='';}if(!selected||!tasks.some(t=>t.id===selected)){selected=(running||tasks.find(t=>t.state==='pending')||tasks[0]).id;lastKey='';}lastRunning=running?.id||null;selectedGroup=selectedGroup||tasks.find(t=>t.id===selected)?.group_id||selected;showSessions();await showActive();const task=tasks.find(t=>t.id===selected);const group=tasks.filter(t=>(t.group_id||t.id)===selectedGroup);const grouped=group.length>1;const groupRunning=group.some(t=>t.state==='running'||t.state==='pending');document.getElementById('task-detail').hidden=grouped&&!detailOpen;setLogo(brandMark,grouped?null:task.model,grouped?'codex':task.worker);agentTitle.textContent=grouped?(groupRunning?'多Agent协作中':'多Agent协作日志'):workName(task.worker)+' 协作日志';agentTitle.className=groupRunning?'running-title':'';headerModel.textContent=grouped?'':task.model ? 'LLM: '+task.model+(task.model_source==='配置'?'（配置）':'') : 'LLM: 未记录';title.textContent=task.name||'未命名任务';meta.textContent=(states[task.state]||task.state)+' · '+duration(task);receipt.hidden=!task.receipt;receiptPath.textContent=task.receipt||'';const detail=await fetch('api/task/'+selected,{cache:'no-store'});if(!detail.ok)throw new Error('工单暂不可用');const data=await detail.json();draw(data.timeline);err.textContent='';}catch(e){err.textContent='连接中断：'+e.message;}finally{refreshing=false;}}
refresh();setInterval(refresh,1000);
</script></body></html>
